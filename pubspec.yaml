name: flutter_json_editor
description: A Flutter widget that dynamically generates forms from JSON Schema (Draft 7) with full CRUD support, inline validation, and customizable field editors.
version: 0.8.0
homepage: https://github.com/safenow/flutter_json_editor

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.7
  file_picker: ^13.1.0
  flutter_svg: ^2.0.17
  image_picker: ^1.2.4
  intl: any
  json_schema: ^5.2.2
  material_ui: ^1.6.0
  phone_numbers_parser: ^9.0.24
  url_launcher: ^6.3.3
  uuid: ^4.0.0
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image_picker_platform_interface: ^2.11.2

flutter:
  generate: true
  uses-material-design: true
