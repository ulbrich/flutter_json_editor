name: flutter_json_editor_example
description: Example app demonstrating flutter_json_editor

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_json_editor:
    path: ../
  intl: any
  json_schema: ^5.2.2
  material_ui: ^1.6.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/office-plan.svg
    - assets/images/body-parts.svg
    - assets/schemas/en.json
    - assets/schemas/de.json
    - assets/schemas/avatar_lookup.json